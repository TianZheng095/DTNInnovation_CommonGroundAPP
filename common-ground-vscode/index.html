<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Common Ground · Mobility together</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">↗</span>
        <div>common ground<small>BETTER MOVEMENT. TOGETHER.</small></div>
      </div>

      <div class="switch">
        <button id="resbtn" onclick="setMode('resident')">◉ &nbsp; Resident app</button>
        <button id="citybtn" onclick="setMode('city')">▦ &nbsp; City workspace</button>
      </div>

      <div class="top-actions">
        <label class="language-wrap" for="languageSelect">
          <span>Language</span>
          <select id="languageSelect" aria-label="Language selector">
            <option value="en">English</option>
            <option value="et">Eesti</option>
            <option value="de">Deutsch</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <button id="profileButton" class="profile-button" onclick="setMode('resident'); nav('profile');">Profile</button>
        <div class="avatar"><span>Tartu, Estonia</span><b>KG</b></div>
      </div>
    </header>

    <main id="app"></main>

    <footer>
      <span>Common Ground · Giving mobility planning a human perspective.</span>
      <span>Interactive MVP · Demo data · Saved in this browser</span>
    </footer>

    <div id="modal"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
